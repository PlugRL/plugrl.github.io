site_url: https://plugrl.github.io
site_name: PlugRL
site_description: An RL infrastructure that keeps the training stack and the environment stack in separate dependency worlds.
repo_url: https://github.com/PlugRL/plugrl.github.io
repo_name: PlugRL/plugrl.github.io
edit_uri: edit/main/docs/
plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: zh
          name: 中文
          build: true
          nav_translations:
            Home: 主页
            User Guide: 用户指南
            Algorithm: 算法
            Environment: 环境
            Policy: 策略
            Contributing: 贡献指南
            Protocol: 通信协议
            Get Started: 快速开始
  - exclude:
      glob:
        - '**/sitemap.xml'
theme:
  name: material
  features:
    - navigation.tracking
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - navigation.tabs.sticky
    - navigation.expand
    - navigation.footer
    # navigation.instant is deliberately absent: mkdocs-static-i18n cannot keep
    # the language switcher contextual with it enabled, and --strict fails.
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight

# Without these, fenced blocks render as bare <pre><code>: no syntax
# highlighting, and content.code.copy has nothing to attach a button to.
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md

  - User Guide:
      - Overview: user_guide/index.md
      - Get Started: user_guide/get_started.md

  - Protocol:
      - Overview: protocol/index.md

  - Algorithm:
      - Overview: algorithm/index.md
      - PPO: algorithm/ppo.md
      - Custom Algorithm: algorithm/custom_algorithm.md

  - Environment:
      - Overview: env/index.md
      - Libero Environment: env/libero_env.md
      - Custom Environment: env/custom_env.md

  - Policy:
      - Overview: policy/index.md
      - DPPO Policies: policy/dppo_policy.md
      - Custom Policy: policy/custom_policy.md

  - Contributing:
      - Overview: contributing/index.md
      - Pre-commit: contributing/pre_commit.md
      - Environment: contributing/env.md
      - Policy: contributing/policy.md
      - Algorithm: contributing/algorithm.md